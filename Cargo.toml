[package]
name = "btc-ln-crawler"
version = "0.1.0"
edition = "2024"
authors = ["Charmaine Ndolo <charmaine.ndolo@tu-dresden.de>"]
license = "MIT"

[dependencies]

clap = { version = "4.5.23", features = ["derive"] }
env_logger = "0.11.5"
tonic_lnd = { git = "https://github.com/Kixunil/tonic_lnd.git" }
log = "0.4.22"
maxminddb = "0.27.1"
reqwest = "0.13.1"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
toml = "0.9.10+spec-1.1.0"

[dev-dependencies]
tempfile = "3.24.0"
